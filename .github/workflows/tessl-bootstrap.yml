name: Tessl bootstrap

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [aarch64, arm, i686, x86_64]
        default: aarch64
      audit_only:
        description: Only run the audit (no compilation)
        type: boolean
        default: false
      reuse_built_debs:
        description: Reuse .deb from a previous run (much faster)
        type: boolean
        default: false

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fork patch: keep TERMUX_REPO_APP__PACKAGE_NAME at com.termux so prebuilt
  # non-bootstrap deps can still be fetched instead of rebuilt.
  TESSL_FORK_ALLOW_CROSS_REPO_DEPS: "true"
  ARCH: ${{ inputs.arch }}

jobs:
  # ---------------------------------------------------------------------
  # Audit: proves WHY we cannot just repack upstream .debs.
  # Upstream packages are compiled with /data/data/com.termux baked into both
  # the archive layout and the ELF strings, so a repack is useless for us.
  # ---------------------------------------------------------------------
  audit:
    name: Audit upstream prefix
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Resolve our prefix
        run: |
          . scripts/properties.sh
          {
            echo "OUR_PACKAGE=$TERMUX_APP__PACKAGE_NAME"
            echo "OUR_PREFIX=$TERMUX__PREFIX"
            echo "OUR_DATA_DIR=$TERMUX_APP__DATA_DIR"
            echo "REPO_PACKAGE=$TERMUX_REPO_APP__PACKAGE_NAME"
          } | tee prefix.env

      - name: Download and inspect one upstream deb
        run: |
          set -euo pipefail
          . prefix.env
          curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-$ARCH/Packages.gz" | gunzip > pkgs.txt
          F=$(awk '/^Package: dpkg$/,/^$/' pkgs.txt | grep -m1 '^Filename:' | awk '{print $2}')
          echo "deb: $F"
          curl -sL -o dpkg.deb "https://packages-cf.termux.dev/apt/termux-main/$F"
          rm -rf ex && mkdir ex && dpkg-deb -x dpkg.deb ex

      - name: Report the mismatch
        run: |
          set -euo pipefail
          . prefix.env
          BIN=$(find ex -type f -path '*bin/dpkg' | head -1)
          echo "=== archive layout (upstream) ==="
          find ex -type f -path '*bin/dpkg'
          echo
          echo "=== ELF strings (upstream) ==="
          strings "$BIN" | grep -oE '/data/data/[a-z0-9.]+' | sort -u
          echo
          echo "=== conclusion ==="
          echo "upstream binaries hardcode /data/data/com.termux -> repack cannot work."
          echo "We must COMPILE the closure with our own prefix."
          if strings "$BIN" | grep -q 'com\.termux'; then
            echo "CONFIRMED: com.termux is baked into the binaries."
          else
            echo "UNEXPECTED: no com.termux found; upstream may have changed."
          fi

  # ---------------------------------------------------------------------
  # The real build. ONE run-docker.sh invocation so that the
  # /data/data/.built-packages markers inside the container survive between
  # the package compile and the bootstrap assembly; otherwise every package
  # would be compiled twice.
  #
  # scripts/build-bootstraps.sh does the whole chain:
  #   build-package.sh per package -> extract .deb -> second stage files
  #   -> validate_bootstrap_rootfs (ABORTS on any com.termux in ELF)
  #   -> bootstrap-<arch>.zip with SYMLINKS.txt
  #
  # No -i flag anywhere: dependencies are compiled locally, never downloaded,
  # so no upstream .so can leak in with com.termux inside it.
  # ---------------------------------------------------------------------
  build-bootstrap:
    name: Compile closure + build bootstrap zip (${{ inputs.arch }})
    if: ${{ !inputs.audit_only }}
    needs: audit
    # NOT ubuntu-slim: the slim runners have no docker daemon.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      TERMUX_BUILDER_IMAGE_NAME: tessl/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Restore package builder image cache
        id: imgcache
        uses: actions/cache@v4
        with:
          path: tessl-builder-image.tar
          key: builder-image-v1

      - name: Load cached package builder image
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: docker load -i tessl-builder-image.tar

      - name: Build the package builder image
        run: |
          docker build -t tessl/package-builder:latest scripts/
          docker save tessl/package-builder:latest | gzip > tessl-builder-image.tar
          docker buildx prune -af

      # ---------------------------------------------------------------
      # FORK PATCH: los .deb YA viven en el host, no hace falta montar nada.
      #
      # run-docker.sh hace  --volume $REPOROOT:/home/builder/termux-packages
      # y TERMUX_BUILT_DEBS_DIRECTORY es /home/builder/termux-packages/output,
      # o sea que output/ del workspace ES el directorio de salida del
      # contenedor. Cachearlo es cachear un path normal del repo.
      #
      # El montaje --volume extra que se intento antes (a
      # /home/builder/termux-packages/output) sobra y estorba: no aportaba
      # persistencia, solo anadia una capa con otros permisos.
      - name: Restore compiled packages
        if: ${{ inputs.reuse_built_debs }}
        uses: actions/cache/restore@v4
        with:
          path: output
          key: >-
            bootstrap-debs-v1-${{ env.ARCH }}-${{
              hashFiles('scripts/**', 'packages/**', '.github/workflows/tessl-bootstrap.yml') }}

      # ---------------------------------------------------------------
      # FORK PATCH: permission denied al escribir el zip.
      #
      # El contenedor corre con el uid de la imagen (1000) y el workspace de
      # GitHub Actions es del uid 1001. create_bootstrap_archive hace
      #
      #     mv -f $BOOTSTRAP_TMPDIR/bootstrap-$1.zip $TERMUX_PACKAGES_DIRECTORY/
      #
      # y ese destino esta dentro del bind-mount, o sea en el workspace del
      # runner: uid 1000 no puede escribir ahi.
      #
      # Este error salio ahora porque es el PRIMER run que llega a este paso:
      # todos los anteriores morian en el gate, mas abajo. No es una
      # regresion de la cache.
      #
      # Se abre la escritura en vez de pelear con el mapeo de uid, que en
      # Actions exigiria sudo chown y dejaria el checkout en un uid raro.
      - name: Make the workspace writable by the container user
        run: |
          sudo chown -R 1000:1000 .
          sudo chmod -R a+rwX .

      - name: Show the prefix we are building for
        run: |
          . scripts/properties.sh
          {
            echo "OUR_PACKAGE=$TERMUX_APP__PACKAGE_NAME"
            echo "OUR_PREFIX=$TERMUX__PREFIX"
            echo "OUR_DATA_DIR=$TERMUX_APP__DATA_DIR"
            echo "PREFIX_LEN=${#TERMUX__PREFIX}"
          } | tee prefix.env
          cat prefix.env

      - name: Compile closure and assemble bootstrap zip
        run: |
          set -euo pipefail
          # ca-certificates + openssl: sin ellos 'pkg update' no tiene TLS y
          # falla con 'None of the mirrors are accessible'. proot, python y git
          # se anaden porque el runtime los usa.
          if [ "${{ inputs.reuse_built_debs }}" = "true" ]; then
            export TESSL_REUSE_BUILT_DEBS=1
            echo "debs en cache: $(ls output 2>/dev/null | wc -l)"
          fi
          ./scripts/run-docker.sh -d ./scripts/build-bootstraps.sh \
            --architectures "$ARCH" \
            --add ca-certificates,openssl,proot,python,git 2>&1 | tee bootstrap-build.log
          ls -lh output/bootstrap-*.zip

      # Guardar DESPUES de ensamblar: si el gate falla, lo que hay en output/
      # no sirve y no debe cachearse.
      - name: Save compiled packages
        if: ${{ inputs.reuse_built_debs }}
        uses: actions/cache/save@v4
        with:
          path: output
          key: >-
            bootstrap-debs-v1-${{ env.ARCH }}-${{
              hashFiles('scripts/**', 'packages/**', '.github/workflows/tessl-bootstrap.yml') }}

      - name: Collect built packages
        run: |
          # Los .deb ya estan en output/ del workspace: TERMUX_BUILT_DEBS_DIRECTORY es
          # /home/builder/termux-packages/output, que es el mismo bind-mount del repo.
          #
          # Antes se buscaban con find / -path '*termux*' -newermt '-8 horas' y se
          # copiaban a out/. Eso era un bug latente:
          #   1) si el build pasa de 8 horas, no encuentra nada
          #   2) con TESSL_REUSE_BUILT_DEBS los .deb vienen de la cache con su mtime
          #      original, asi que un cache hit de dias atras los descartaba en silencio
          #   3) 'ls out/ | head -40' moria con SIGPIPE en cuanto habia mas de 40
          #      ficheros: 'ls: write error: Broken pipe'. Era cosmetico (el codigo de
          #      salida es el de head), pero hacia ruido en un log que ya cuesta leer.
          NDEB=$(find output -maxdepth 1 -name '*.deb' | wc -l)
          NZIP=$(find output -maxdepth 1 -name 'bootstrap-*.zip' | wc -l)
          echo "debs=$NDEB  zips=$NZIP"
          find output -maxdepth 1 -name '*.deb' -printf '  %f\n' | sort | sed -n '1,40p'
          [ "$NDEB" -gt 40 ] && echo "  ... ($NDEB en total)"
          ls -lh "output/bootstrap-$ARCH.zip" 2>/dev/null || echo "  zip AUSENTE"

      - name: Verify our prefix is baked into the compiled debs
        run: |
          set -euo pipefail
          . scripts/properties.sh
          rm -rf verify && mkdir verify
          FAIL=0
          for pkg in bash dash dpkg apt curl tar gzip coreutils; do
            DEB=$(ls output/${pkg}_*.deb 2>/dev/null | head -1 || true)
            if [ -z "$DEB" ]; then echo "MISSING deb: $pkg"; FAIL=1; continue; fi
            rm -rf verify/$pkg && mkdir -p verify/$pkg
            dpkg-deb -x "$DEB" "verify/$pkg"
            BIN=$(find "verify/$pkg" -type f -path '*bin/*' | head -1)
            [ -z "$BIN" ] && { echo "no binary in $pkg"; continue; }
            OURS=$(strings "$BIN" | grep -c 'apexmiguel9' || true)
            THEIRS=$(strings "$BIN" | grep -c 'com\.termux' || true)
            printf "%-12s ours=%-4s theirs=%-4s %s\n" "$pkg" "$OURS" "$THEIRS" "$(basename "$BIN")"
            [ "$OURS" -eq 0 ] && FAIL=1
            [ "$THEIRS" -ne 0 ] && FAIL=1
          done
          echo "---"
          if [ "$FAIL" -eq 0 ]; then echo "PASS: our prefix is baked in, zero com.termux"; else echo "FAIL"; exit 1; fi

      # -------------------------------------------------------------------
      # Independent gate on the ZIP itself. Does not trust the build job:
      # re-extracts and inspects what would actually ship.
      # -------------------------------------------------------------------
      - name: Inspect the bootstrap zip
        run: |
          set -euo pipefail
          . scripts/properties.sh
          ZIP="output/bootstrap-$ARCH.zip"
          test -f "$ZIP" || { echo "no $ZIP"; exit 1; }
          echo "zip: $ZIP  ($(stat -c %s "$ZIP") bytes)"

          rm -rf z && mkdir z && unzip -q "$ZIP" -d z
          echo "entradas: $(find z -type f | wc -l)"
          test -f z/SYMLINKS.txt && echo "SYMLINKS.txt: $(wc -l < z/SYMLINKS.txt) lineas"

          echo
          echo "=== 1) busca /data/data/com.termux en TODOS los ficheros ==="
          HITS=0
          while IFS= read -r -d '' f; do
            if head -c 4 "$f" | grep -q $'\x7fELF'; then
              if strings -a "$f" | grep -q '/data/data/com\.termux'; then
                echo "  ELF   ${f#z/}"; HITS=$((HITS+1))
              fi
            elif grep -lI '/data/data/com\.termux' "$f" 2>/dev/null; then
              echo "  TEXT  ${f#z/}"; HITS=$((HITS+1))
            fi
          done < <(find z -type f -print0)
          echo "  offenders: $HITS"
          if [ "$HITS" -ne 0 ]; then echo "FAIL: el zip contiene rutas de com.termux"; exit 1; fi
          echo "  OK: 0 referencias a com.termux"

          echo
          echo "=== 2) nuestro prefijo debe estar presente en los binarios criticos ==="
          MISS=0
          for t in bash dash dpkg apt apt-get curl tar gzip clear; do
            F=$(find z -type f -path "*/bin/$t" | head -1)
            if [ -z "$F" ]; then printf '  %-8s AUSENTE\n' "$t"; continue; fi
            O=$(strings -a "$F" | grep -c 'apexmiguel9' || true)
            printf '  %-8s ours=%-4s %s\n' "$t" "$O" "${F#z/}"
            [ "$O" -eq 0 ] && MISS=$((MISS+1))
          done
          if [ "$MISS" -ne 0 ]; then echo "FAIL: $MISS binarios sin nuestro prefijo"; exit 1; fi

          echo
          echo "=== 3) estructura de runtime ==="
          for d in etc/apt/apt.conf.d etc/apt/preferences.d etc/dpkg \
                   var/lib/dpkg var/lib/dpkg/info etc/tls; do
            if [ -e "z/$d" ]; then printf '  OK      %s\n' "$d"
            else printf '  FALTA   %s\n' "$d"; MISS=$((MISS+1)); fi
          done
          for f in etc/tls/cert.pem etc/profile etc/apt/sources.list bin/bash bin/dpkg bin/pkg; do
            if [ -e "z/$f" ]; then printf '  OK      %s\n' "$f"
            else printf '  FALTA   %s\n' "$f"; MISS=$((MISS+1)); fi
          done
          [ "$MISS" -ne 0 ] && { echo "FAIL: faltan $MISS ficheros/directorios"; exit 1; }

          echo
          echo "=== 4) openssl y CA (de esto depende 'pkg update') ==="
          for t in openssl gpg gpgv ca-certificates; do
            F=$(find z -type f -path "*/bin/$t" | head -1)
            [ -z "$F" ] && F=$(find z -type d -path "*/etc/tls/$t.crt" | head -1)
            printf '  %-18s %s\n' "$t" "${F:-AUSENTE}"
          done

      - name: Pack artifact
        run: |
          # GitHub's artifact uploader rejects ':' in filenames (NTFS limitation)
          # and termux versions use epochs like 1:2026.09.25. Tar it instead.
          mkdir -p staged/debs
          i=0
          for f in output/*.deb; do
            [ -e "$f" ] || continue
            i=$((i+1))
            safe=$(basename "$f" | tr ':' '-')
            cp "$f" "staged/debs/$safe"
          done
          cp "output/bootstrap-$ARCH.zip" staged/
          cp bootstrap-build.log staged/ 2>/dev/null || true
          tar -czf "apex-bootstrap-$ARCH.tar.gz" -C staged .
          ls -lh "apex-bootstrap-$ARCH.tar.gz"
          echo "packed=$i debs + zip"

      - uses: actions/upload-artifact@v4
        with:
          name: apex-bootstrap-${{ inputs.arch }}
          path: apex-bootstrap-${{ inputs.arch }}.tar.gz
          retention-days: 30

  # Indexa los .deb que ya produce el job de bootstrap y los publica como
  # repo apt. Sin esto, pkg install baja de packages-cf.termux.dev y los
  # binarios vienen compilados para /data/data/com.termux, que no existe en
  # nuestra app. Se comprobo en el dispositivo:
  #
  #   unable to stat './data/data/com.termux' (which was about to be installed)
  #
  # o sea que instalar cualquier paquete era imposible.
  publish-repo:
    needs: build-bootstrap
    if: ${{ !inputs.audit_only && inputs.arch == 'aarch64' }}
    runs-on: ubuntu-latest
    # El workflow declara "permissions: {}" a nivel de raiz, asi que sin esto
    # el push a gh-pages no tiene permisos y falla con "not authorized".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          path: src

      - name: Get built packages
        uses: actions/download-artifact@v4
        with:
          name: apex-bootstrap-${{ inputs.arch }}
          path: art

      - name: Build the apt repo tree
        run: |
          set -euo pipefail
          # El artefacto es un tarball (Pack artifact), no .deb sueltos: hay que
          # desempaquetarlo primero. Sin esto "find art -name '*.deb'" no
          # encuentra nada y el job muere con "debs a indexar: 0".
          echo "--- contenido del artefacto ---"
          ls -l art
          TARBALL=$(find art -maxdepth 1 -name '*.tar.gz' | head -1)
          test -n "$TARBALL" || { echo "no hay tarball"; exit 1; }
          mkdir -p debs unpacked
          tar -xzf "$TARBALL" -C unpacked
          echo "--- dentro del tarball ---"
          find unpacked -maxdepth 2 -type d | head -5
          find unpacked -name '*.deb' -exec cp {} debs/ \;
          N=$(ls debs | wc -l)
          echo "debs a indexar: $N"
          test "$N" -gt 0 || { echo "no hay debs tras desempaquetar"; exit 1; }
          #
          # scripts/mkarepo.sh envuelve termux-apt-repo y corrige el layout:
          # la herramienta separa los paquetes "Architecture: all" en
          # binary-all, pero el apt de Termux solo descarga binary-$ARCH. En el
          # repo real de Termux no existe binary-all, asi que sin el merge esos
          # 19 paquetes (ca-certificates, termux-keyring, termux-am...) serian
          # invisibles para el usuario.
          bash src/scripts/mkarepo.sh debs repo stable main "$ARCH"
          echo "--- comprobacion ---"
          test ! -d repo/dists/stable/main/binary-all || { echo "queda binary-all"; exit 1; }
          grep -q '^Package: termux-keyring$' repo/dists/stable/main/binary-$ARCH/Packages \
            || { echo "termux-keyring no esta indexado"; exit 1; }
          echo "OK: $(grep -c '^Package: ' repo/dists/stable/main/binary-$ARCH/Packages) paquetes"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd repo
          DIST_NAME=stable; ARCH_NAME=aarch64
          git init -q .
          git config user.name  "apex-ci"
          git config user.email "ci@apex.local"
          git checkout -q -b gh-pages
          # Los .deb viven dentro de dists/, que es como los publica
          # termux-apt-repo y como los resuelve apt via el campo Filename.
          echo "apex-linux package repository (aarch64)" > README.md
          git add -A
          PKGS=$(grep -c '^Package: ' "dists/$DIST_NAME/main/binary-$ARCH_NAME/Packages" || echo 0)
          git commit -q -m "repo: $PKGS packages para aarch64"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "publicado en:"
          echo "  deb [trusted=yes] https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ stable main"
