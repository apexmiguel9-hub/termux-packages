name: Tessl bootstrap

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [aarch64, arm, i686, x86_64]
        default: aarch64
      audit_only:
        description: Only run the audit (no compilation)
        type: boolean
        default: false

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fork patch: keep TERMUX_REPO_APP__PACKAGE_NAME at com.termux so prebuilt
  # non-bootstrap deps can still be fetched instead of rebuilt.
  TESSL_FORK_ALLOW_CROSS_REPO_DEPS: "true"

jobs:
  # ---------------------------------------------------------------------
  # Audit: proves WHY we cannot just repack upstream .debs.
  # Upstream packages are compiled with /data/data/com.termux baked into both
  # the archive layout and the ELF strings, so a repack is useless for us.
  # ---------------------------------------------------------------------
  audit:
    name: Audit upstream prefix
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Resolve our prefix
        run: |
          . scripts/properties.sh
          {
            echo "OUR_PACKAGE=$TERMUX_APP__PACKAGE_NAME"
            echo "OUR_PREFIX=$TERMUX__PREFIX"
            echo "REPO_PACKAGE=$TERMUX_REPO_APP__PACKAGE_NAME"
          } | tee prefix.env

      - name: Download and inspect one upstream deb
        run: |
          set -euo pipefail
          . prefix.env
          curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-${{ inputs.arch }}/Packages.gz" | gunzip > pkgs.txt
          F=$(awk '/^Package: coreutils$/,/^$/' pkgs.txt | grep -m1 '^Filename:' | awk '{print $2}')
          echo "deb: $F"
          curl -sL -o coreutils.deb "https://packages-cf.termux.dev/apt/termux-main/$F"
          rm -rf ex && mkdir ex && dpkg-deb -x coreutils.deb ex

      - name: Report the mismatch
        run: |
          set -euo pipefail
          . prefix.env
          echo "=== archive layout (upstream) ==="
          find ex -type f -name cat | head -3
          echo
          echo "=== ELF strings (upstream) ==="
          strings "$(find ex -type f -name cat | head -1)" | grep -oE '/data/data/[a-z0-9.]+' | sort -u
          echo
          echo "=== conclusion ==="
          echo "upstream binaries hardcode /data/data/com.termux -> repack cannot work."
          echo "We must COMPILE the seed closure with our own prefix."
          if strings "$(find ex -type f -name cat | head -1)" | grep -q 'com\.termux'; then
            echo "CONFIRMED: com.termux is baked into the binaries."
          fi

  # ---------------------------------------------------------------------
  # The real build: compile the full bootstrap closure (86 packages) with
  # TERMUX_PREFIX=/data/data/io.github.apexmiguel9.termux/files/usr
  #
  # NOTE: no -I flag here. -I downloads prebuilt deps from the upstream repo,
  # which would give us com.termux-prefixed .so files linked into our
  # binaries. Every package in the closure must be built locally.
  # ---------------------------------------------------------------------
  build-seed:
    name: Compile bootstrap closure (${{ inputs.arch }})
    if: ${{ !inputs.audit_only }}
    needs: audit
    # NOT ubuntu-slim: the slim runners have no docker daemon.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      TERMUX_BUILDER_IMAGE_NAME: tessl/package-builder:latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Restore package builder image cache
        id: imgcache
        uses: actions/cache@v4
        with:
          path: tessl-builder-image.tar
          key: builder-image-v1

      - name: Load cached package builder image
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: docker load -i tessl-builder-image.tar

      - name: Build the package builder image
        run: |
          docker build -t tessl/package-builder:latest scripts/
          docker save tessl/package-builder:latest | gzip > tessl-builder-image.tar
          docker buildx prune -af

      - name: Resolve build order for the bootstrap closure
        id: order
        run: |
          set -euo pipefail
          SEEDS="bash bzip2 command-not-found coreutils curl dash debianutils diffutils
                 dos2unix ed findutils gawk grep gzip inetutils less lsof nano net-tools
                 patch procps proot psmisc sed tar termux-core termux-exec
                 termux-keyring termux-tools unzip util-linux xz-utils apt"
          : > ordered.txt
          for p in $SEEDS; do
            d="packages/$p"
            if [ ! -d "$d" ]; then echo "WARN: missing $d"; continue; fi
            TERMUX_ARCH=${{ inputs.arch }} python3 scripts/buildorder.py "$d" \
              | awk '{print $1}' >> ordered.txt
          done
          awk 'NF && !seen[$0]++' ordered.txt > ordered.final.txt
          mv ordered.final.txt ordered.txt
          echo "packages=$(wc -l < ordered.txt)"
          cat ordered.txt

      - name: Compile
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          ./scripts/run-docker.sh -d ./build-package.sh -C \
            -a "${{ inputs.arch }}" $(cat ordered.txt)

      - name: Collect built packages
        run: |
          mkdir -p out
          find / -name '*.deb' -path '*termux*' -newermt '-8 hours' -exec cp -n {} out/ \; 2>/dev/null || true
          ls -lh out/ | head -60
          echo "built=$(ls out/ 2>/dev/null | wc -l) / expected=$(wc -l < ordered.txt)"
      - name: Verify our prefix is baked into the binaries
        run: |
          set -euo pipefail
          . scripts/properties.sh
          echo "expecting: $TERMUX__PREFIX"
          rm -rf verify && mkdir verify
          FAIL=0
          for pkg in coreutils bash grep tar sed curl; do
            DEB=$(ls out/${pkg}_*.deb 2>/dev/null | head -1 || true)
            if [ -z "$DEB" ]; then echo "MISSING deb: $pkg"; FAIL=1; continue; fi
            rm -rf verify/$pkg && mkdir -p verify/$pkg
            dpkg-deb -x "$DEB" "verify/$pkg"
            BIN=$(find "verify/$pkg" -type f -path '*bin/*' | head -1)
            [ -z "$BIN" ] && { echo "no binary in $pkg"; continue; }
            OURS=$(strings "$BIN" | grep -c 'apexmiguel9' || true)
            THEIRS=$(strings "$BIN" | grep -c 'com\.termux' || true)
            printf "%-12s ours=%-4s theirs=%-4s %s\n" "$pkg" "$OURS" "$THEIRS" "$(basename $BIN)"
            [ "$OURS" -eq 0 ] && FAIL=1
          done
          echo "---"
          if [ "$FAIL" -eq 0 ]; then echo "PASS: our prefix is baked in."; else echo "FAIL"; exit 1; fi

      - name: Pack debs
        run: |
          # GitHub's artifact uploader rejects ':' in filenames (NTFS limitation)
          # and termux versions use epochs like 1:2026.09.25. Tar it instead.
          mkdir -p staged
          i=0
          for f in out/*.deb; do
            [ -e "$f" ] || continue
            i=$((i+1))
            safe=$(basename "$f" | tr ':' '-')
            cp "$f" "staged/$safe"
          done
          tar -czf "tessl-packages-${{ inputs.arch }}.tar.gz" -C staged .
          ls -lh "tessl-packages-${{ inputs.arch }}.tar.gz"
          echo "packed=$i debs"

      - uses: actions/upload-artifact@v4
        with:
          name: tessl-packages-${{ inputs.arch }}
          path: tessl-packages-${{ inputs.arch }}.tar.gz
          retention-days: 14
